name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"

      - name: Show toolchain
        run: xcodebuild -version

      - name: Build macOS targets
        run: |
          set -e
          for target in WaypoMac WaypoHarness WaypoTunnelMac; do
            xcodebuild -project Waypo.xcodeproj -target "$target" -configuration Debug build CODE_SIGNING_ALLOWED=NO
          done

      - name: Build iOS target
        run: xcodebuild -project Waypo.xcodeproj -target Waypo -configuration Debug -sdk iphonesimulator build CODE_SIGNING_ALLOWED=NO

      - name: Run tests
        run: xcodebuild -project Waypo.xcodeproj -scheme WaypoTests -destination 'platform=macOS' test CODE_SIGNING_ALLOWED=NO

  engine:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Build engine library
        working-directory: Core
        env:
          CORE_REPO_URL: ${{ secrets.CORE_REPO_URL }}
        run: ./build-library.sh

      - name: Build tunnel extensions with engine
        run: |
          set -e
          xcodebuild -project Waypo.xcodeproj -target WaypoTunnelMac -configuration Debug build CODE_SIGNING_ALLOWED=NO FRAMEWORK_SEARCH_PATHS="$(SRCROOT)/Core"
          xcodebuild -project Waypo.xcodeproj -target WaypoTunnel -configuration Debug -sdk iphonesimulator build CODE_SIGNING_ALLOWED=NO FRAMEWORK_SEARCH_PATHS="$(SRCROOT)/Core"

      - name: Data-path self-test
        run: |
          set -e
          xcodebuild -project Waypo.xcodeproj -target WaypoHarness -configuration Debug build CODE_SIGNING_ALLOWED=NO FRAMEWORK_SEARCH_PATHS="$(SRCROOT)/Core"
          HARNESS_DIR=$(xcodebuild -project Waypo.xcodeproj -target WaypoHarness -configuration Debug -showBuildSettings 2>/dev/null | awk '/ BUILT_PRODUCTS_DIR/{print $3}')
          sudo "$HARNESS_DIR/WaypoHarness" --self-test

      - name: Upload engine library
        uses: actions/upload-artifact@v4
        with:
          name: Libbox.xcframework
          path: Core/Libbox.xcframework
          retention-days: 7
