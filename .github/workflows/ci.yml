name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"

      - name: Show toolchain
        run: xcodebuild -version

      - name: Build macOS targets
        run: |
          set -eo pipefail
          for target in WaypoMac WaypoHarness WaypoTunnelMac; do
            xcodebuild -project Waypo.xcodeproj -target "$target" -configuration Debug build CODE_SIGNING_ALLOWED=NO 2>&1 \
              | tee "build-$target.log"
          done

      - name: Build iOS target
        run: |
          set -eo pipefail
          xcodebuild -project Waypo.xcodeproj -target Waypo -configuration Debug -sdk iphonesimulator build CODE_SIGNING_ALLOWED=NO 2>&1 \
            | tee build-Waypo-ios.log

      - name: Run tests
        run: |
          set -eo pipefail
          xcodebuild -project Waypo.xcodeproj -scheme WaypoTests -destination 'platform=macOS' test CODE_SIGNING_ALLOWED=NO 2>&1 \
            | tee test.log

      # Compiler output is otherwise buried in the step log, which needs an
      # authenticated session to read. Annotations are visible on the run page.
      - name: Report diagnostics
        if: failure()
        run: |
          {
            grep -hE '(error|warning): ' build-*.log test.log 2>/dev/null | sort -u | head -30
            grep -hA4 'The following build commands failed' build-*.log test.log 2>/dev/null | head -20
          } > summary.txt || true
          # Nothing matched the usual shapes, so fall back to the tail of the
          # most recently written log rather than reporting silence.
          if [ ! -s summary.txt ]; then
            tail -30 "$(ls -t build-*.log test.log 2>/dev/null | head -1)" > summary.txt || true
          fi
          {
            echo '### Diagnostics'
            echo '```'
            cat summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          while IFS= read -r line; do
            echo "::error::$line"
          done < summary.txt

  engine:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"

      # The built-in cache keys on go.sum, which does not exist until the engine
      # source is cloned below, so it can never hit and reports that failure as a
      # warning on every run. Replaced with an explicit cache over the paths that
      # actually cost time: the module download cache, the compiled
      # gomobile/gobind toolchain, and the compile cache the engine build uses.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false

      - name: Locate Go cache paths
        id: gocache
        run: |
          {
            echo "mod=$(go env GOMODCACHE)"
            echo "build=$(go env GOCACHE)"
            echo "bin=$(go env GOPATH)/bin"
          } >> "$GITHUB_OUTPUT"

      # Actions cache entries are immutable per key, so a fixed key would be saved
      # once and reused forever, going stale as upstream moves. The run_id forces a
      # fresh save each run while restore-keys pick up the newest prefix match. The
      # build cache is content-addressed, so changed engine source simply misses
      # rather than serving a stale compile.
      - name: Cache Go modules and build output
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.gocache.outputs.mod }}
            ${{ steps.gocache.outputs.build }}
            ${{ steps.gocache.outputs.bin }}
          key: go-${{ runner.os }}-${{ hashFiles('Core/build-library.sh') }}-${{ github.run_id }}
          restore-keys: |
            go-${{ runner.os }}-${{ hashFiles('Core/build-library.sh') }}-
            go-${{ runner.os }}-

      - name: Build engine library
        working-directory: Core
        env:
          CORE_REPO_URL: ${{ secrets.CORE_REPO_URL }}
        run: ./build-library.sh

      - name: Build tunnel extensions with engine
        run: |
          set -e
          SLICE=$(find Core/Libbox.xcframework -maxdepth 1 -type d -name 'macos*' -exec basename {} \; | sort | head -1)
          echo "macOS slice: $SLICE"
          xcodebuild -project Waypo.xcodeproj -target WaypoTunnelMac -configuration Debug build CODE_SIGNING_ALLOWED=NO \
            "FRAMEWORK_SEARCH_PATHS=\$(SRCROOT)/Core/Libbox.xcframework/$SLICE" \
            "OTHER_LDFLAGS=-F\$(SRCROOT)/Core/Libbox.xcframework/$SLICE -framework Libbox -framework IOUSBHost -framework SystemConfiguration -framework CoreWLAN -lresolv -lbsm"
          xcodebuild -project Waypo.xcodeproj -target WaypoMac -configuration Debug build CODE_SIGNING_ALLOWED=NO \
            "FRAMEWORK_SEARCH_PATHS=\$(SRCROOT)/Core/Libbox.xcframework/$SLICE" \
            "OTHER_LDFLAGS=-F\$(SRCROOT)/Core/Libbox.xcframework/$SLICE -framework Libbox -framework IOUSBHost -framework SystemConfiguration -framework CoreWLAN -lresolv -lbsm"
          SIM_SLICE=$(find Core/Libbox.xcframework -maxdepth 1 -type d -name 'ios*simulator*' -exec basename {} \; | sort | head -1)
          echo "iOS simulator slice: $SIM_SLICE"
          xcodebuild -project Waypo.xcodeproj -target WaypoTunnel -configuration Debug -sdk iphonesimulator build CODE_SIGNING_ALLOWED=NO \
            "FRAMEWORK_SEARCH_PATHS=\$(SRCROOT)/Core/Libbox.xcframework/$SIM_SLICE" \
            "OTHER_LDFLAGS=-F\$(SRCROOT)/Core/Libbox.xcframework/$SIM_SLICE -framework Libbox"

      - name: Data-path self-test
        run: |
          set -e
          SLICE=$(find Core/Libbox.xcframework -maxdepth 1 -type d -name 'macos*' -exec basename {} \; | sort | head -1)
          echo "macOS slice: $SLICE"
          xcodebuild -project Waypo.xcodeproj -target WaypoHarness -configuration Debug build CODE_SIGNING_ALLOWED=NO ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            "FRAMEWORK_SEARCH_PATHS=\$(SRCROOT)/Core/Libbox.xcframework/$SLICE" \
            "OTHER_LDFLAGS=-F\$(SRCROOT)/Core/Libbox.xcframework/$SLICE -framework Libbox -framework IOUSBHost -framework SystemConfiguration -framework CoreWLAN -lresolv -lbsm"
          HARNESS_DIR=$(xcodebuild -project Waypo.xcodeproj -target WaypoHarness -configuration Debug -showBuildSettings ARCHS=arm64 ONLY_ACTIVE_ARCH=YES 2>/dev/null | awk '/ BUILT_PRODUCTS_DIR/{print $3}')
          sudo "$HARNESS_DIR/WaypoHarness" --self-test

      # Release, not Debug: a Debug build inflates both the binary and the
      # process footprint, so a Debug number means nothing against the limit
      # the extension is held to.
      #
      # Gating on the budget, annotating at 60% of it. The baseline for a
      # direct configuration under traffic is ~25%, so the warning is the early
      # signal that a change has eaten the headroom request interception will
      # need; crossing the budget itself is the hard stop.
      #
      # A run that produces no summary is an error rather than a warning: the
      # reading is the deliverable here, so a silently absent number would let
      # the gate rot into decoration.
      - name: Extension memory footprint
        run: |
          set -e
          SLICE=$(find Core/Libbox.xcframework -maxdepth 1 -type d -name 'macos*' -exec basename {} \; | sort | head -1)
          echo "macOS slice: $SLICE"
          xcodebuild -project Waypo.xcodeproj -target WaypoHarness -configuration Release build CODE_SIGNING_ALLOWED=NO ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            "FRAMEWORK_SEARCH_PATHS=\$(SRCROOT)/Core/Libbox.xcframework/$SLICE" \
            "OTHER_LDFLAGS=-F\$(SRCROOT)/Core/Libbox.xcframework/$SLICE -framework Libbox -framework IOUSBHost -framework SystemConfiguration -framework CoreWLAN -lresolv -lbsm"
          HARNESS_DIR=$(xcodebuild -project Waypo.xcodeproj -target WaypoHarness -configuration Release -showBuildSettings ARCHS=arm64 ONLY_ACTIVE_ARCH=YES 2>/dev/null | awk '/ BUILT_PRODUCTS_DIR/{print $3}')
          sudo "$HARNESS_DIR/WaypoHarness" --footprint --limit-mb 50 2>&1 | tee "$RUNNER_TEMP/footprint.txt" || true
          {
            echo '### Extension memory footprint'
            echo '```'
            grep -E '^FOOTPRINT|^traffic:|^engine ' "$RUNNER_TEMP/footprint.txt" || echo 'no reading was produced'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if ! grep -q '^FOOTPRINT summary' "$RUNNER_TEMP/footprint.txt"; then
            echo "::error::the footprint run produced no summary line, so the memory gate has nothing to read"
            exit 1
          fi
          if grep -q 'over=1' "$RUNNER_TEMP/footprint.txt"; then
            echo "::error::peak footprint is over the 50 MB budget — request interception cannot fit in the extension at this size"
            exit 1
          fi
          BUDGET=$((50 * 1024 * 1024))
          PEAK=$(sed -n 's/^FOOTPRINT summary peak_phys=\([0-9][0-9]*\).*/\1/p' "$RUNNER_TEMP/footprint.txt" | head -1)
          if [ -n "$PEAK" ] && [ "$PEAK" -ge $((BUDGET * 3 / 5)) ]; then
            echo "::warning::$((PEAK * 100 / BUDGET))% of the 50 MB budget is in use — request interception will need strictly bounded per-connection buffers"
          fi

      - name: Upload engine library
        uses: actions/upload-artifact@v4
        with:
          name: Libbox.xcframework
          path: Core/Libbox.xcframework
          retention-days: 7
